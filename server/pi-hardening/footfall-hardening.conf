# /etc/systemd/system/footfall.service.d/hardening.conf
# Sandbox for the public visit logger: sees only its script and its database folder.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=tmpfs
BindReadOnlyPaths=/home/vc/footfall
BindPaths=/home/vc/.local/share/footfall
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
UMask=0077
IPAddressDeny=any
IPAddressAllow=localhost 100.64.0.0/10 fd7a:115c:a1e0::/48
MemoryMax=128M
TasksMax=64
CPUQuota=50%
ExecStartPost=+/usr/sbin/nft -f /etc/footfall/egress.nft
